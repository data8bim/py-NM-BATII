title:
  en_us: "Rooms\n→ Objects by category"
  fr_fr: "Pièces\n→ Objets par catégories"

tooltip:
  en_us: "Transfer room parameter values to the objects referenced to that room (i.e. whose 'Room' property points to it, such as furniture, casework, fixtures...). Each object receives the value from its own containing room.
         \n\nVersion: {{version}}-[{{date}}.002]"

  fr_fr: "Transfert des valeurs de paramètres des pièces vers les objets qui leur sont référencés (c'est-à-dire dont la propriété « Room » pointe vers elles : mobilier, agencement, appareils...). Chaque objet reçoit la valeur de la pièce qui le contient.
         \n\nVersion: {{version}}-[{{date}}.002]"

help_url: 'https://d8b.fr/'
author: '{{author}}'

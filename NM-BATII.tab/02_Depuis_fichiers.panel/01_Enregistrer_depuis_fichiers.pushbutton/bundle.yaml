title:
  en_us: "Save\nfrom files"
  fr_fr: "Enregistrer\ndepuis fichiers"
tooltip:
  en_us: "Save the Revit file based on the file names in a directory.
         File names must comply with the Nantes Métropole file naming guidelines.
         The Revit file is saved in the parent directory of the file that served as the naming template.
         \n\nVersion: {{version}}-[{{date}}.002]"
  fr_fr: "Enregistrer le fichier Revit sur la base des noms des fichiers d'un répertoire. 
         Les noms des fichiers doivent respecter les règles de nommages des fichiers de Nantes Métropole.
         Le fichier Revit est enregistré dans le répertoire parent du fichier ayant servi de modèle de nommage.
         \n\nVersion: {{version}}-[{{date}}.002]"

help_url: 'https://d8b.fr/'
author: '{{author}}'
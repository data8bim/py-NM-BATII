title:
  en_us: "levels\nfrom files"
  fr_fr: "Niveaux\ndepuis fichiers"
tooltip:
  en_us: "Create the building levels based on the file names in a directory.
         File names must comply with the Nantes Métropole file naming rules.
         The created levels comply with the Nantes Métropole level identification standard.
         \n\nVersion: {{version}}-[{{date}}.002]"
         
  fr_fr: "Créé les niveaux du bâtiment sur la base des noms des fichiers d'un répertoire.
         Les noms des fichiers doivent respecter les règles de nommages des fichiers de Nantes Métropole.
         Les niveaux créés respectent le standard d'identification des niveaux du référentiel Nantes Métropole.
         \n\nVersion: {{version}}-[{{date}}.002]"


title:
  en_us: "3D\nRooms"
  fr_fr: "Pièces\n3D"
tooltip:
  en_us: "Open a dialog to choose a project phase and, optionally, a
         combination of room parameters used to colorize the 3D volumes
         (with a color picker per generated value), then recreate the 3D
         geometry (Mass DirectShapes) matching the computed volumetry of
         every placed room of that phase. One DirectShape per room. Any
         geometry previously generated by this tool for that phase is
         deleted and rebuilt on each run. Creates/reuses a dedicated 3D
         view set to that phase, named and templated via the same naming
         convention system as '01_Vues_+'/'01_Lier_CAO' (NM-BATII Settings
         > 'Vues' tab > 'Nommage des vues' and 'Vues personnalisées'
         tables, 'Pièces 3D' column); chosen colors are applied as
         graphic overrides in that view only.
         \n\nVersion: {{version}}-[{{date}}.001]"
  fr_fr: "Ouvre une interface pour choisir une phase du projet et,
         éventuellement, une combinaison de paramètres de pièces servant
         à coloriser les volumes 3D (avec un choix de couleur pour
         chaque valeur générée), puis recrée la géométrie 3D (catégorie
         Volume) correspondant à la volumétrie calculée de toutes les
         pièces placées de cette phase. Une DirectShape par pièce. Toute
         géométrie précédemment générée par cet outil pour cette phase
         est supprimée puis reconstruite à chaque exécution.
         Crée/réutilise une vue 3D dédiée réglée sur cette phase, nommée
         et gabaritée via le même système de convention de nommage que
         « 01_Vues_+ »/« 01_Lier_CAO » (Paramètres NM-BATII > onglet
         « Vues » > tables « Nommage des vues » et « Vues personnalisées »,
         colonne « Pièces 3D ») ; les couleurs choisies sont appliquées en
         surcharge graphique dans cette vue uniquement.
         \n\nVersion: {{version}}-[{{date}}.001]"

help_url: 'https://d8b.fr/'

title:
  en_us: "Simplify room\nseparators"
  fr_fr: "Simplifier les\nséparateurs de pièces"
tooltip:
  en_us: "Cleans room separation lines in the active floor plan view.
         \n
         \n  Repeated until full convergence:
         \n  1 — Merges all collinear segments that overlap or touch into a single segment
         \n  2 — Removes duplicates flagged by Revit overlap warnings
         \n
         \n  Final single pass:
         \n  3 — Removes any remaining exact duplicate lines
         \n
         \n  Works on a selection or on all lines in the active view.
         \n\nVersion: {{version}}-[{{date}}.001]"
  fr_fr: "Nettoie les séparateurs de pièce dans la vue plan active.
         \n
         \n  Répété jusqu'à convergence complète :
         \n  1 — Fusionne tous les segments colinéaires qui se chevauchent ou se touchent
         \n  2 — Supprime les doublons signalés par les avertissements Revit
         \n
         \n  Passe unique finale :
         \n  3 — Supprime les doublons exacts résiduels
         \n
         \n  Fonctionne sur une sélection ou sur tous les séparateurs de la vue active.
         \n\nVersion: {{version}}-[{{date}}.001]"

help_url: 'https://d8b.fr/'
author: '{{author}}'
context: active-plan-view
